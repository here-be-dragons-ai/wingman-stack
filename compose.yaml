name: wingman-stack

# The wingman platform as a gateway in front of a model backend. Defaults to the
# reference backend: an mlx-vlm Qwen3.8-27B server on the host.
#
# The model server itself is NOT in this compose file, and with the MLX backend
# it cannot be: Docker on macOS has no access to the Metal GPU, so Qwen runs
# natively on the host (see the mlx-qwen38-apple-silicon repo). The containers
# reach it through host.docker.internal.

services:
  platform:
    image: ghcr.io/adrianliechti/wingman-platform
    restart: unless-stopped

    # Loopback only. This gateway has no authentication configured, so it must
    # not be reachable from the LAN. See "Adding authentication" in
    # doc/configuration.md.
    ports:
      - "127.0.0.1:${WINGMAN_PORT:-4242}:8080"

    environment:
      # Consumed by config/platform.yaml through ${...} expansion. Points
      # straight at the model server; set LLM_URL to http://effort-guard:8080/v1
      # to route through the optional guard below.
      LLM_URL: ${LLM_URL:-${LLM_UPSTREAM_URL:-http://host.docker.internal:8888}/v1}
      LLM_MODEL: ${LLM_MODEL:-Qwen3.8-27B-local}
      LLM_TOKEN: ${LLM_TOKEN:-sk-local}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./config/platform.yaml:/config.yaml:ro

    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional backstop that clamps reasoning_effort values the Qwen3.8 chat
  # template rejects with HTTP 500.
  #
  # Not started by default. wingman-agent 0.16.1 clamps these client-side from
  # its model catalog, which covers the normal setup. Enable the guard when the
  # CLI is older, when the model name is one the catalog does not recognise, or
  # for any other client that talks to this gateway directly:
  #
  #   make up-guard
  #
  # See doc/qwen38-mlx.md for the exact mapping and the evidence behind it.
  effort-guard:
    profiles: ["guard"]

    build:
      context: ./effort-guard
    image: wingman-stack/effort-guard:1
    restart: unless-stopped

    environment:
      # Base URL of the native model server, without the /v1 suffix.
      UPSTREAM_URL: ${LLM_UPSTREAM_URL:-http://host.docker.internal:8888}
      LOG_REWRITES: ${LOG_REWRITES:-1}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
